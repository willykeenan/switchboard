<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project library · Switchboard</title><link rel="stylesheet" href="/inspector/inspector.css"><link rel="stylesheet" href="/capabilities/header.css"><script src="/capabilities/nav.js" defer></script><script src="/inspector/context.js" defer></script><script src="/inspector/library-service-panel.js" defer></script><link rel="stylesheet" href="/inspector/workspace.css"><script src="/inspector/workspace.js" defer></script><script src="/inspector/library.js" defer></script></head><body><header class="topbar"><a class="brand" href="/constellations"><span class="mark">✳</span><span><strong>Switchboard</strong><small>Your agents. Your direction.</small></span></a><nav aria-label="Switchboard"><a href="/constellations">Workflow</a><a href="/agents">Agents</a><a href="/capabilities">Custom capabilities</a></nav><div class="project-control"><button class="project-trigger" id="project-button" aria-label="Choose project"><span id="project-name">Project</span><small>▦</small></button></div><div class="top-actions"><a id="back-workflow" href="/constellations">← Workflow</a></div></header><main class="library-shell"><div class="library-heading"><div><span class="eyebrow" id="library-context">PROJECT KNOWLEDGE</span><h1>Library</h1></div><div class="library-actions"><button id="team-context" hidden>Team context</button><button id="sources">Sources</button><button id="review">Record review</button><button id="new-note" class="primary">+ Note</button></div></div><details id="library-services" class="library-services"><summary>Library services · reading assignments…</summary><div class="library-service-content"></div></details><div class="library-mode" aria-label="Library view"><button id="workspace-mode" aria-pressed="true">Workspace</button><button id="requirements-mode" aria-pressed="false">Requirements</button><button id="records-mode" aria-pressed="false">Evidence &amp; records</button></div><section class="library-workspace" id="library-workspace" aria-label="Library workspace"></section><div class="library-toolbar"><input id="query" type="search" placeholder="Search research, evidence and decisions…" aria-label="Search library"><select id="lane-filter" aria-label="Lane collection"><option value="">All workstreams</option></select><select id="kind-filter" aria-label="Record type"><option value="">All records</option><option>Research</option><option>Evidence</option><option>Decision</option><option>Finding</option><option>Research note</option><option>Library review</option><option>Work record</option><option>Team context</option></select><button id="refresh-library" aria-label="Refresh library sources">↻</button></div><p id="library-error" class="notice-error" hidden></p><div class="library-content" id="library-content"><section class="library-results"><div class="result-count"><span id="count">Reading library…</span><span id="review-count"></span></div><div id="results"></div><button id="more" hidden>Load more</button></section><section class="library-preview" id="preview"><div class="empty-preview"><span>▤</span><p>Select a source to read it</p></div></section></div><footer class="library-footer"><span id="index-status">Connecting sources</span><progress id="index-progress" hidden aria-label="Indexed source units"></progress><span id="coverage"></span></footer></main><dialog class="library-dialog" id="note-dialog"><form id="note-form"><h2>New library note</h2><label>Title<input name="title" maxlength="200" required></label><label>Type<select name="kind"><option>Research note</option><option>Decision</option><option>Finding</option></select></label><label>Note<textarea name="body" required></textarea></label><div class="dialog-actions"><button type="button" data-close="note-dialog">Cancel</button><button class="primary">Save note</button></div><p class="form-error"></p></form></dialog><dialog class="library-dialog" id="review-dialog"><form id="review-form"><h2>Record library review</h2><p id="review-summary" class="status"></p><label>Next step<select name="decision"><option>Reuse</option><option>Extend</option><option>Replicate</option><option>New research</option></select></label><label>What did the evidence establish or leave unanswered?<textarea name="reason" maxlength="4000" required></textarea></label><div class="dialog-actions"><button type="button" data-close="review-dialog">Cancel</button><button class="primary">Save review</button></div><p class="form-error"></p></form></dialog></body></html>
